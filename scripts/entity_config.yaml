# ── 通用类别词配置（跨领域） ──
# 此文件用于 extract_named_entities() 中的模式匹配提取。
# 可以按领域添加专有后缀，或使用默认的跨领域通用列表。
# 修改后直接生效，无需改动代码。

# 默认的通用类别词列表（不依赖任何特定领域）
default:
  任务/任务类型:
    - 任务
    - 试点
    - 改革
    - 项目
    - 工程
    - 计划
    - 行动
    - 方案
    - 专项
    - 示范
    - 建设
    - 试点单位

  机构/组织:
    - 机构
    - 中心
    - 平台
    - 基地
    - 联盟
    - 委员会
    - 办公室
    - 部门
    - 学院
    - 医院
    - 学校
    - 大学
    - 研究院
    - 研究所
    - 实验室

  体系/模式:
    - 体系
    - 模式
    - 机制
    - 制度
    - 框架
    - 范式
    - 格局
    - 生态

  文档/标准:
    - 规划
    - 报告
    - 标准
    - 规范
    - 文件
    - 方案
    - 办法
    - 规定

  人员/团队:
    - 团队
    - 小组
    - 队伍
    - 委员会

  基础设施/技术:
    - 系统
    - 网络
    - 平台
    - 设施
    - 设备
    - 模型
    - 工具

  活动/事件:
    - 论坛
    - 会议
    - 大赛
    - 活动
    - 峰会
    - 论坛
    - 展览
    - 培训

# 教育领域扩展（可选，用户按需启用或关闭）
education:
  教育专属:
    - 学科
    - 专业
    - 课程
    - 教材
    - 学位
    - 课堂
    - 教学团队
    - 育人体系
    - 培养方案
    - 培养模式
    - 学术团队
    - 创新团队
    - 研究团队
    - 教研室
    - 教务处

# 医疗领域扩展（示例）
medical:
  医疗专属:
